# Phase 6 TASK 6.4d (AS-12) — the whole stack, one command, zero external API keys:
#
#     docker compose -f compose.selfhost.yml up --build
#
# then open http://localhost:3000 and choose "Continue locally". Local models only: Ollama for
# the persona/planner/scorer/narrator, faster-whisper for ASR and Piper for TTS inside
# `realtime`, Postgres/Redis/MinIO for storage. Model weights download on first boot into named
# volumes — never into an image layer. First boot takes a while (Ollama pulls ~2 GB).
#
# `realtime` is stateful: one process holds each live session. Do not scale it behind a
# round-robin balancer — reconnection (resume) only works against the process that holds the
# session. See docs/18-deployment.md.

include:
  - docker-compose.yml

x-app-env: &app-env
  ENVIRONMENT: selfhost
  DATABASE_URL: postgresql+asyncpg://interactai:interactai@postgres:5432/interactai
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: interactai-audio
  S3_FORCE_PATH_STYLE: "true"
  # Self-host signing keys. Change all three for anything reachable beyond localhost.
  APP_SECRET: selfhost-app-secret-change-me-000000000000
  JWT_SECRET: selfhost-jwt-secret-change-me-000000000000
  WS_TOKEN_SECRET: selfhost-ws-secret-change-me-00000000000
  WEB_ORIGIN: http://localhost:3000
  API_BASE_URL: http://localhost:8000
  REALTIME_WS_URL: ws://localhost:8080/ws
  SELF_HOST_LOCAL_LOGIN: "true"
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_API_BASE: http://ollama:11434
  MODEL_PERSONA: ollama/qwen2.5:3b-instruct
  MODEL_PERSONA_LOCAL: ollama/qwen2.5:3b-instruct
  MODEL_PLANNER: ollama/qwen2.5:3b-instruct
  MODEL_ENDPOINTER: ""
  MODEL_NARRATOR: ollama/qwen2.5:3b-instruct
  MODEL_JUDGE: ollama/qwen2.5:3b-instruct
  HOST_CLASS: selfhost

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [interactai]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b-instruct"]
    networks: [interactai]

  migrate:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "cd services/api && alembic upgrade head && cd /srv && python scripts/seed.py"]
    networks: [interactai]

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [interactai]

  realtime:
    build: { context: ., dockerfile: services/realtime/Dockerfile }
    environment:
      <<: *app-env
      MAX_CONCURRENT_SESSIONS: "2"
      SHUTDOWN_DRAIN_TIMEOUT_S: "30"
    ports: ["8080:8080"]
    volumes:
      - models:/models
      - recordings:/srv/data/recordings
    # Must exceed uvicorn's graceful close (10s) + the session drain (30s).
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    networks: [interactai]

  coach:
    build: { context: ., dockerfile: services/coach/Dockerfile }
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    networks: [interactai]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_REALTIME_HTTP_URL: http://localhost:8080
        NEXT_PUBLIC_SELF_HOST: "true"
    ports: ["3000:3000"]
    depends_on: [api]
    networks: [interactai]

volumes:
  ollama:
  models:
  recordings:
