name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9"
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict services/realtime/app
      - run: uv run mypy services/api/app
      - run: pnpm --filter @interactai/web run lint
      - run: pnpm --filter @interactai/web run typecheck

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Regenerate from packages/schema/ws-messages.schema.json
        run: |
          uv run python packages/schema/generate.py
          pnpm --filter @interactai/schema run generate:ts
      - name: Fail if the working tree differs from what's committed
        run: |
          git diff --exit-code -- \
            services/realtime/app/schemas/ws.py \
            apps/web/lib/ws-types.ts

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      # Integration tests spin up real Postgres/Redis via testcontainers — Docker is
      # preinstalled on GitHub-hosted ubuntu runners, no service containers needed here.
      - run: uv sync --all-packages
      - run: uv run pytest tests/unit tests/integration -v

  test-safety:
    # Task 2.6 (CLAUDE.md §7): "The safety suite is not optional and does not get skipped to
    # make CI green." Every case in tests/safety makes a real model call — no mock can prove a
    # real model follows the static prompt's hard rules — so unlike test-python this job needs
    # GROQ_API_KEY and a running Ollama serving MODEL_PERSONA_LOCAL. If GROQ_API_KEY isn't
    # configured as a repo secret, this job fails loudly rather than skipping, by design: a
    # green build must never quietly mean "safety wasn't checked."
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages
      - name: Fail loudly if GROQ_API_KEY is not configured
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is not set — the safety suite cannot run against MODEL_PERSONA. Configure it as a repo secret; this job must not be allowed to pass by skipping."
            exit 1
          fi
      - name: Install and start Ollama, pull MODEL_PERSONA_LOCAL
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull qwen2.5:3b-instruct
      - run: uv run pytest tests/safety -v

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @interactai/web run test

  content-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages
      - run: uv run python scripts/validate_content.py
