[project]
name = "interactai-api"
version = "0.1.0"
description = "FastAPI service — auth, scenario/rubric/persona CRUD, sessions. Stateless. Never touches audio."
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "authlib>=1.4.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "uuid-utils>=0.10.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.20",
    "cryptography>=50.0.0",
]

[tool.uv]
package = false
