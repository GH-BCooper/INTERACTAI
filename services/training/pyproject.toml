[project]
name = "interactai-training"
version = "0.1.0"
description = "Notebooks and scripts for the scorer fine-tune. Phase 5 only. Not deployed."
requires-python = "==3.11.*"
dependencies = [
    "sentence-transformers>=6.0.0",
    "transformers>=4.0.0",
    "torch>=2.13.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "wandb>=0.19.0",
    # Phase 5 additions: synthetic generation (5.2b) reuses the same litellm-routed model calls
    # as services/coach's prompted scorer; dataset/build.py and eval/harness.py talk to the
    # same Postgres every other service does.
    "litellm>=1.60.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # DeBERTa-v3's tokenizer is SentencePiece-based; transformers' fallback tiktoken conversion
    # path can't parse its spm.model at all (a real bug hit and fixed live during Phase 5 build
    # — see docs/PROGRESS.md) without this installed explicitly.
    "sentencepiece>=0.2.0",
]

[tool.uv]
package = false
