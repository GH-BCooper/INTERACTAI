slug: general_interview
name: General interview
description: >
  Applies to technical, behavioural and viva scenario families. Seven criteria: the five
  universal ones plus technical_depth and tradeoff_reasoning for scenarios that involve
  system or implementation discussion.
# docs/phase-2-BUILD.md TASK 2.5f: turn-score -> session-score rollup policy, stored here so
# it's a rubric property, not application code. mean_weighted_by_confidence: each turn's score
# for a criterion is weighted by that turn's confidence before averaging, so a low-confidence
# outlier turn can't swing the session aggregate as hard as a high-confidence one.
# min_turns_with_signal: a criterion needs at least this many turns with confidence above the
# gating threshold to aggregate to a number at all — below it, "not enough signal" (CLAUDE.md
# §1.6), never a partial average over one or two turns.
aggregation_policy:
  method: mean_weighted_by_confidence
  min_turns_with_signal: 2
criteria:
  - key: structure
    name: Structure
    description: Does the answer have a discernible arc rather than a stream of facts?
    anchor_descriptors:
      "1": "No discernible organisation. The answer starts mid-thought or never resolves."
      "2": "Facts in the order they occurred to the speaker, with no signposting — a listener would need to ask how it ended."
      "3": "Recognisable beginning and end, but the middle wanders or the order has to be reconstructed by the listener."
      "4": "A clear arc with one weak transition or a missing close. Still easy to follow throughout."
      "5": "Opens by naming the situation, moves through action to outcome, and closes by returning to the question asked."

  - key: specificity
    name: Specificity
    description: Does the answer name concrete details rather than staying abstract?
    anchor_descriptors:
      "1": "Entirely abstract — no names, numbers, tools, or concrete artifacts mentioned anywhere in the answer."
      "2": "One concrete detail surfaces only when asked directly; the rest of the answer stays generic."
      "3": "A few concrete details appear unprompted, but key claims about impact or scale remain unquantified."
      "4": "Most claims carry a specific number, name, or artifact; one or two remain vague even on request."
      "5": "Every material claim is anchored to a number, a named tool or person, or a decision the listener could verify."

  - key: relevance
    name: Relevance
    description: Does the answer address the question asked, or drift to a more comfortable topic?
    anchor_descriptors:
      "1": "The answer addresses a different question than the one asked and never returns to it."
      "2": "The answer opens on-topic but drifts within the first third and never comes back to the question."
      "3": "The answer covers the question but pads it with tangential detail a listener would need to skip past."
      "4": "The answer stays on topic throughout, with only brief detours that are clearly flagged as asides."
      "5": "Every sentence serves the question asked; nothing would need to be cut to tighten the answer."

  - key: concision
    name: Concision
    description: Does the answer take the shortest path to a complete response?
    anchor_descriptors:
      "1": "The answer repeats the same point three or more times in different words without adding information."
      "2": "The answer eventually lands the point but takes roughly twice as long as the content requires."
      "3": "The answer has one clear redundant pass — a restatement or a false start — before settling."
      "4": "The answer is efficient with a single minor detour that a light edit would remove entirely."
      "5": "The answer reaches the point directly and stops once it is made, with no restatement anywhere."

  - key: confidence
    name: Confidence
    description: Does the delivery convey that the speaker trusts their own answer?
    anchor_descriptors:
      "1": "The answer is dominated by hedges such as 'I guess' or 'maybe' on claims the speaker should know cold."
      "2": "Hedging appears on more than half of the answer's key claims, including ones within the speaker's own experience."
      "3": "The answer hedges on the harder half of its claims but states the easier ones plainly and directly."
      "4": "The answer states claims plainly with occasional hedging only where the uncertainty is genuine."
      "5": "The answer states every claim plainly and flags uncertainty only where it is genuinely warranted."

  - key: technical_depth
    name: Technical depth
    description: Does the answer show mechanism-level understanding, not just naming technologies?
    anchor_descriptors:
      "1": "The answer names technologies but cannot describe how any of them actually work or interact."
      "2": "The answer describes what a component does at a surface level but not how or why it behaves that way."
      "3": "The answer explains the mechanism for the central component but treats surrounding pieces as black boxes."
      "4": "The answer explains the mechanism for most components discussed, with one gap the listener has to fill."
      "5": "The answer explains every component's mechanism, including what happens when a stated assumption breaks."

  - key: tradeoff_reasoning
    name: Trade-off reasoning
    description: Does the answer weigh alternatives, or present the chosen approach as the only option?
    anchor_descriptors:
      "1": "The answer presents one approach with no indication any alternative was ever considered."
      "2": "The answer names an alternative only when asked, without comparing it to the chosen approach."
      "3": "The answer names one alternative and states a preference, but does not say what was given up."
      "4": "The answer compares at least two approaches and names a concrete cost of the one that was chosen."
      "5": "The answer compares multiple approaches against the problem's constraints and names exactly what was traded away and why that trade was acceptable."
